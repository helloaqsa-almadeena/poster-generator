<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>AQSA Poster Generator</title>
<link rel="icon" type="image/x-icon" href="/static/favicon.ico"/>
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png"/>
<link rel="manifest" href="/static/manifest.json"/>
<meta name="theme-color" content="#1a1a2e"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="AQSA Poster"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet"/>
<style>

/* ═══════════════════════════════════════
   RESET & TOKENS
═══════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #F6F7F9;
  --surface:   #FFFFFF;
  --border:    #E4E7EC;
  --border2:   #CDD2DB;
  --text:      #111827;
  --text2:     #6B7280;
  --text3:     #9CA3AF;
  --accent:    #E8001E;
  --accent2:   #B5001A;
  --blue:      #2563EB;
  --blue-soft: #EFF6FF;
  --green:     #16A34A;
  --yellow:    #CA8A04;
  --radius:    10px;
  --shadow:    0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --shadow-md: 0 4px 16px rgba(0,0,0,.10);
}

html { -webkit-text-size-adjust: 100%; }
body {
  font-family: 'DM Sans', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
}

/* ═══════════════════════════════════════
   NAVBAR
═══════════════════════════════════════ */
.nav {
  position: sticky; top: 0; z-index: 50;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  height: 56px;
  display: flex; align-items: center;
  padding: 0 20px;
  gap: 12px;
}
.nav-logo {
  font-size: 16px; font-weight: 700;
  color: var(--text); letter-spacing: -.3px;
  display: flex; align-items: center; gap: 8px;
}
.nav-logo .dot {
  width: 28px; height: 28px; border-radius: 7px;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 800; color: #fff;
  letter-spacing: 0; flex-shrink: 0;
}
.nav-spacer { flex: 1; }
.nav-pill {
  font-size: 11px; font-weight: 600;
  letter-spacing: .5px; text-transform: uppercase;
  background: var(--bg); color: var(--text2);
  border: 1px solid var(--border);
  padding: 4px 10px; border-radius: 20px;
}

/* ═══════════════════════════════════════
   PAGE WRAPPER
═══════════════════════════════════════ */
.page {
  max-width: 1080px;
  margin: 0 auto;
  padding: 28px 20px 80px;
}

/* ═══════════════════════════════════════
   TWO-COL GRID
═══════════════════════════════════════ */
.grid {
  display: grid;
  grid-template-columns: 1fr 360px;
  gap: 20px;
  align-items: start;
}

/* ═══════════════════════════════════════
   CARD
═══════════════════════════════════════ */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 14px;
  overflow: hidden;
}
.card-head {
  padding: 14px 18px 0;
  display: flex; align-items: center;
  justify-content: space-between;
}
.card-head-title {
  font-size: 11px; font-weight: 700;
  letter-spacing: 1px; text-transform: uppercase;
  color: var(--text2);
}
.card-body { padding: 12px 18px 18px; }

/* ═══════════════════════════════════════
   FONT SIZE CONTROL
═══════════════════════════════════════ */
.size-badge {
  font-family: 'DM Mono', monospace;
  font-size: 11px; font-weight: 500;
  background: var(--blue-soft);
  color: var(--blue);
  padding: 2px 9px; border-radius: 20px;
  min-width: 64px; text-align: center;
}
.slider-track {
  position: relative;
  padding: 10px 0 4px;
}
input[type=range] {
  -webkit-appearance: none;
  width: 100%; height: 4px;
  background: var(--border);
  border-radius: 4px; outline: none; cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--blue);
  cursor: pointer;
  box-shadow: 0 0 0 3px rgba(37,99,235,.15);
  transition: box-shadow .15s;
}
input[type=range]::-webkit-slider-thumb:active {
  box-shadow: 0 0 0 5px rgba(37,99,235,.2);
}
input[type=range]::-moz-range-thumb {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--blue); border: none; cursor: pointer;
}
.size-steps {
  display: flex; gap: 6px; margin-top: 10px;
}
.step-btn {
  flex: 1; padding: 7px 0; text-align: center;
  border: 1.5px solid var(--border); border-radius: 8px;
  font-size: 12px; font-weight: 600; color: var(--text2);
  cursor: pointer; transition: all .15s;
  background: var(--surface);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.step-btn:hover  { border-color: var(--blue); color: var(--blue); }
.step-btn.active { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); }

/* ═══════════════════════════════════════
   MODE TABS
═══════════════════════════════════════ */
.tabs {
  display: flex; gap: 0;
  background: var(--bg); border-radius: 8px;
  padding: 3px; margin-bottom: 16px;
}
.tab {
  flex: 1; padding: 9px 0; text-align: center;
  border-radius: 6px; font-size: 13px; font-weight: 500;
  color: var(--text2); cursor: pointer;
  transition: all .15s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.tab.active {
  background: var(--surface); color: var(--text);
  font-weight: 600;
  box-shadow: 0 1px 4px rgba(0,0,0,.1);
}

/* ═══════════════════════════════════════
   ITEM CARDS
═══════════════════════════════════════ */
.item {
  border: 1.5px solid var(--border);
  border-radius: 9px; padding: 14px;
  margin-bottom: 10px; background: var(--bg);
  animation: slideDown .18s ease;
}
@keyframes slideDown {
  from { opacity:0; transform:translateY(-6px); }
  to   { opacity:1; transform:translateY(0); }
}
.item-row {
  display: flex; align-items: center;
  justify-content: space-between; margin-bottom: 10px;
}
.item-num {
  font-size: 11px; font-weight: 700;
  letter-spacing: .5px; text-transform: uppercase;
  color: var(--accent);
}
.item-del {
  width: 28px; height: 28px; border-radius: 7px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text3); font-size: 12px;
  transition: all .15s;
  -webkit-tap-highlight-color: transparent;
}
.item-del:hover { border-color: var(--accent); color: var(--accent); background: #fff5f5; }

.fields {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 10px;
}
.field { display: flex; flex-direction: column; gap: 4px; }
.field label {
  font-size: 10px; font-weight: 700;
  letter-spacing: .8px; text-transform: uppercase;
  color: var(--text3);
}
.field input {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 8px; padding: 10px 12px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px; color: var(--text);
  outline: none; width: 100%;
  transition: border-color .15s, box-shadow .15s;
  -webkit-appearance: none;
}
.field input:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(37,99,235,.1);
}
.field input::placeholder { color: var(--text3); }

.add-item {
  width: 100%; padding: 11px;
  border: 1.5px dashed var(--border2);
  border-radius: 9px; background: transparent;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px; font-weight: 600;
  color: var(--text2); cursor: pointer;
  transition: all .15s; margin-top: 2px;
  -webkit-tap-highlight-color: transparent;
}
.add-item:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-soft); }

/* ═══════════════════════════════════════
   UPLOAD ZONE
═══════════════════════════════════════ */
.drop {
  border: 2px dashed var(--border2);
  border-radius: 10px; padding: 40px 20px;
  text-align: center; cursor: pointer;
  position: relative; transition: all .15s;
  background: var(--bg);
}
.drop:hover, .drop.over { border-color: var(--blue); background: var(--blue-soft); }
.drop input[type=file] {
  position: absolute; inset: 0;
  opacity: 0; cursor: pointer; width: 100%; height: 100%;
}
.drop-icon { font-size: 30px; margin-bottom: 8px; }
.drop-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
.drop-sub   { font-size: 12px; color: var(--text2); }
.drop-name  { margin-top: 10px; font-size: 12px; font-weight: 600; color: var(--blue); }
.tip {
  margin-top: 10px; padding: 9px 12px;
  background: #FEFCE8; border: 1px solid #FDE68A;
  border-radius: 7px; font-size: 12px; color: #92400E;
  line-height: 1.4;
}

/* ═══════════════════════════════════════
   GENERATE BUTTON
═══════════════════════════════════════ */
.gen {
  width: 100%; padding: 15px 20px;
  background: var(--accent); color: #fff; border: none;
  border-radius: var(--radius);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px; font-weight: 700;
  cursor: pointer; display: flex;
  align-items: center; justify-content: center; gap: 8px;
  transition: background .15s, transform .1s, box-shadow .15s;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  letter-spacing: .3px;
}
.gen:hover:not(:disabled) {
  background: var(--accent2);
  box-shadow: 0 6px 20px rgba(232,0,30,.3);
  transform: translateY(-1px);
}
.gen:active:not(:disabled) { transform: translateY(0); }
.gen:disabled { background: var(--border2); color: var(--text3); cursor: not-allowed; }

/* status */
.status {
  display: none; margin-top: 10px;
  padding: 10px 14px; border-radius: 8px;
  font-size: 13px; font-weight: 500;
  align-items: center; gap: 8px;
}
.status.on { display: flex; }
.status.ok  { background:#F0FFF4; border:1px solid #A7F3D0; color:#065F46; }
.status.err { background:#FFF5F5; border:1px solid #FECACA; color:#991B1B; }
.status.wait{ background:var(--blue-soft); border:1px solid #BFDBFE; color:#1E40AF; }

/* ═══════════════════════════════════════
   LIVE PREVIEW PANEL
═══════════════════════════════════════ */
.preview-col { position: sticky; top: 70px; }

.preview-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.preview-bar {
  background: var(--text);
  padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between;
}
.preview-bar-title {
  font-size: 11px; font-weight: 700;
  letter-spacing: 1.5px; text-transform: uppercase;
  color: rgba(255,255,255,.7);
}
.preview-bar-badge {
  font-size: 11px; font-weight: 600;
  background: rgba(255,255,255,.12); color: #fff;
  padding: 2px 9px; border-radius: 20px;
}

/* A5 paper */
.paper-wrap {
  background: #DDE1E7;
  padding: 14px;
  display: flex; justify-content: center;
}
.paper {
  background: #fff;
  width: 100%;
  aspect-ratio: 148 / 210;
  border-radius: 3px;
  box-shadow: var(--shadow-md);
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-end;
  padding: 5% 7% 8%;
  position: relative; overflow: hidden;
}
.paper-deal {
  position: absolute; top: 0; left: 0; right: 0;
  height: 40%;
  border-bottom: 1.5px dashed #E0E0E0;
  display: flex; align-items: center; justify-content: center;
}
.paper-deal-label {
  font-size: 8px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase;
  color: #CCCCCC;
}
.paper-price {
  display: flex; align-items: flex-end;
  justify-content: center; gap: 1px;
  margin-bottom: 5px; line-height: 1;
}
.p-int {
  font-weight: 900; color: #EE0000;
  font-family: Impact, 'Arial Black', sans-serif;
  line-height: 1; transition: font-size .2s ease;
}
.p-dec {
  font-weight: 900; color: #EE0000;
  font-family: Impact, 'Arial Black', sans-serif;
  margin-bottom: 3px; transition: font-size .2s ease;
}
.p-cur {
  color: #111; font-weight: 700;
  font-family: 'DM Sans', sans-serif;
  margin-bottom: 3px; transition: font-size .2s ease;
}
.paper-name {
  font-family: Impact, 'Arial Black', sans-serif;
  font-weight: 900; color: #000;
  text-align: center; text-transform: uppercase;
  word-break: break-word; line-height: 1.1;
  transition: font-size .2s ease; max-width: 100%;
}

/* preview footer */
.preview-foot {
  padding: 10px 16px;
  border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.preview-pg { font-size: 11px; color: var(--text2); font-weight: 500; }
.pg-nav { display: flex; gap: 5px; }
.pg-btn {
  width: 28px; height: 28px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 13px; color: var(--text2);
  transition: all .15s;
  -webkit-tap-highlight-color: transparent;
}
.pg-btn:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
.pg-btn:disabled { opacity: .35; cursor: not-allowed; }

/* ═══════════════════════════════════════
   SPINNER
═══════════════════════════════════════ */
.spin {
  width: 15px; height: 15px;
  border: 2px solid currentColor; border-top-color: transparent;
  border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }
.hidden { display: none !important; }

/* ═══════════════════════════════════════
   FOOTER
═══════════════════════════════════════ */
footer {
  text-align: center; padding: 24px 20px;
  font-size: 11px; color: var(--text3);
  letter-spacing: .5px;
  border-top: 1px solid var(--border);
}

/* ═══════════════════════════════════════
   RESPONSIVE — TABLET
═══════════════════════════════════════ */
@media(max-width: 900px) {
  .grid { grid-template-columns: 1fr 300px; gap: 16px; }
}

/* ═══════════════════════════════════════
   RESPONSIVE — MOBILE
═══════════════════════════════════════ */
@media(max-width: 680px) {
  .page { padding: 16px 14px 60px; }
  .grid {
    display: flex; flex-direction: column; gap: 0;
  }
  /* form first, preview last */
  .form-col  { order: 1; }
  .preview-col {
    order: 2;
    position: static;
    margin-top: 14px;
  }
  /* compact paper on mobile */
  .paper-wrap { padding: 10px; }
  .paper { max-height: 240px; }
  .paper-deal-label { font-size: 7px; }
  /* inputs bigger tap target */
  .field input { padding: 11px 12px; font-size: 16px; }
  .card-body { padding: 10px 14px 14px; }
  .card-head { padding: 12px 14px 0; }
  /* fields single col on very small */
  @media(max-width: 360px) {
    .fields { grid-template-columns: 1fr; }
  }
}
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <div class="nav-logo">
    <div class="dot">A</div>
    AQSA Poster Generator
  </div>
  <div class="nav-spacer"></div>
  <div class="nav-pill">A5 · د.إ</div>
</nav>

<!-- PAGE -->
<div class="page">
<div class="grid">

  <!-- ══ LEFT: FORM ══ -->
  <div class="form-col">

    <!-- Font Size -->
    <div class="card">
      <div class="card-head">
        <span class="card-head-title">Product Name Size</span>
        <span class="size-badge" id="size-label">Medium</span>
      </div>
      <div class="card-body">
        <div class="slider-track">
          <input type="range" id="slider" min="3" max="5" value="3"
            oninput="setSize(parseInt(this.value))"/>
        </div>
        <div class="size-steps">
          <button class="step-btn active" onclick="setSize(3)">Medium</button>
          <button class="step-btn"        onclick="setSize(4)">Large</button>
          <button class="step-btn"        onclick="setSize(5)">X-Large</button>
        </div>
      </div>
    </div>

    <!-- Products -->
    <div class="card">
      <div class="card-head">
        <span class="card-head-title">Products</span>
      </div>
      <div class="card-body">
        <div class="tabs">
          <div class="tab active" onclick="setMode('manual',this)">✏️ &nbsp;Manual</div>
          <div class="tab"        onclick="setMode('excel',this)">📊 &nbsp;Excel Upload</div>
        </div>

        <!-- Manual -->
        <div id="manual-wrap">
          <div id="items-list"></div>
          <button class="add-item" onclick="addItem()">+ Add Another Product</button>
        </div>

        <!-- Excel -->
        <div id="excel-wrap" class="hidden">
          <div class="drop" id="dropzone">
            <input type="file" id="xfile" accept=".xlsx" onchange="onFile(this)"/>
            <div class="drop-icon">📄</div>
            <div class="drop-title">Tap or drop Excel file</div>
            <div class="drop-sub">.xlsx only</div>
            <div class="drop-name" id="fname"></div>
          </div>
          <div class="tip">Required columns: <strong>Description</strong> &amp; <strong>Price</strong></div>
        </div>
      </div>
    </div>

    <!-- Generate -->
    <div class="card">
      <div class="card-body" style="padding-top:18px">
        <button class="gen" id="gen-btn" onclick="doGenerate()">
          <span id="gen-spin" class="spin hidden"></span>
          <span id="gen-lbl">⬇ &nbsp;Generate &amp; Download</span>
        </button>
        <div class="status" id="status">
          <span id="s-icon"></span>
          <span id="s-text"></span>
        </div>
      </div>
    </div>

  </div><!-- /form-col -->

  <!-- ══ RIGHT: PREVIEW ══ -->
  <div class="preview-col">
    <div class="preview-card">
      <div class="preview-bar">
        <span class="preview-bar-title">Live Preview</span>
        <span class="preview-bar-badge" id="pg-badge">Page 1 of 1</span>
      </div>
      <div class="paper-wrap">
        <div class="paper">
          <div class="paper-deal">
            <span class="paper-deal-label">Deal / Offer Space</span>
          </div>
          <div class="paper-price">
            <span class="p-int" id="p-int">0</span>
            <span class="p-dec" id="p-dec">.00</span>
            <span class="p-cur" id="p-cur">&nbsp;د.إ</span>
          </div>
          <div class="paper-name" id="p-name">PRODUCT NAME</div>
        </div>
      </div>
      <div class="preview-foot">
        <span class="preview-pg" id="pg-label">Page 1 of 1</span>
        <div class="pg-nav">
          <button class="pg-btn" id="pg-prev" onclick="goPg(-1)" disabled>‹</button>
          <button class="pg-btn" id="pg-next" onclick="goPg(1)"  disabled>›</button>
        </div>
      </div>
    </div>
  </div><!-- /preview-col -->

</div><!-- /grid -->
</div><!-- /page -->

<footer>AQSA Poster Generator &nbsp;·&nbsp; A5 Portrait &nbsp;·&nbsp; د.إ</footer>

<script>
/* ── State ── */
const currency = 'د.إ';
let mode    = 'manual';
let items   = [];
let sz      = 3;   // 3=Medium 4=Large 5=XLarge
let pgIdx   = 0;

/* Preview font sizes (px) */
const INT_PX  = { 3:90,  4:110, 5:130 };
const DEC_PX  = { 3:38,  4:48,  5:58  };
const CUR_PX  = { 3:22,  4:28,  5:34  };
const NAME_PX = { 3:20,  4:25,  5:31  };

/* ── Init ── */
addItem();

/* ── Font size ── */
function setSize(v) {
  sz = v;
  document.getElementById('slider').value = v;
  const lbl = { 3:'Medium', 4:'Large', 5:'X-Large' };
  document.getElementById('size-label').textContent = lbl[v];
  document.querySelectorAll('.step-btn').forEach((b,i) => {
    b.classList.toggle('active', i + 3 === v);
  });
  updatePreview();
}

/* ── Mode ── */
function setMode(m, el) {
  mode = m;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('manual-wrap').classList.toggle('hidden', m !== 'manual');
  document.getElementById('excel-wrap').classList.toggle('hidden', m !== 'excel');
}

/* ── Items ── */
function addItem() {
  items.push({ name:'', price:'' });
  renderItems(); updatePreview();
}
function delItem(i) {
  if (items.length <= 1) return;
  items.splice(i, 1);
  if (pgIdx >= items.length) pgIdx = items.length - 1;
  renderItems(); updatePreview();
}
function renderItems() {
  const list = document.getElementById('items-list');
  list.innerHTML = '';
  items.forEach((it, i) => {
    const d = document.createElement('div');
    d.className = 'item';
    d.innerHTML = `
      <div class="item-row">
        <span class="item-num">Product ${i+1}</span>
        ${items.length > 1
          ? `<button class="item-del" onclick="delItem(${i})">✕</button>` : ''}
      </div>
      <div class="fields">
        <div class="field">
          <label>Name</label>
          <input type="text" placeholder="e.g. Basmati Rice 5KG"
            value="${esc(it.name)}"
            oninput="items[${i}].name=this.value;updatePreview()"
            autocomplete="off" autocorrect="off" spellcheck="false"/>
        </div>
        <div class="field">
          <label>Price</label>
          <input type="number" placeholder="0.00"
            step="0.05" min="0" inputmode="decimal"
            value="${esc(it.price)}"
            oninput="items[${i}].price=this.value;updatePreview()"/>
        </div>
      </div>`;
    list.appendChild(d);
  });
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

/* ── Preview ── */
function updatePreview() {
  const it  = items[pgIdx] || { name:'', price:'' };
  const raw = parseFloat(it.price) || 0;
  const int = Math.floor(raw);
  const dec = raw.toFixed(2).split('.')[1] || '00';

  document.getElementById('p-int').textContent  = int;
  document.getElementById('p-dec').textContent  = '.' + dec;
  document.getElementById('p-name').textContent = it.name.trim().toUpperCase() || 'PRODUCT NAME';

  document.getElementById('p-int').style.fontSize  = INT_PX[sz]  + 'px';
  document.getElementById('p-dec').style.fontSize  = DEC_PX[sz]  + 'px';
  document.getElementById('p-cur').style.fontSize  = CUR_PX[sz]  + 'px';
  document.getElementById('p-name').style.fontSize = NAME_PX[sz] + 'px';

  const total = items.length;
  const lbl   = `Page ${pgIdx+1} of ${total}`;
  document.getElementById('pg-badge').textContent = lbl;
  document.getElementById('pg-label').textContent = lbl;
  document.getElementById('pg-prev').disabled = pgIdx === 0;
  document.getElementById('pg-next').disabled = pgIdx >= total - 1;
}
function goPg(dir) {
  pgIdx = Math.max(0, Math.min(items.length-1, pgIdx+dir));
  updatePreview();
}

/* ── File upload ── */
function onFile(inp) {
  document.getElementById('fname').textContent =
    inp.files[0] ? '✓ ' + inp.files[0].name : '';
}
const dz = document.getElementById('dropzone');
dz.addEventListener('dragover',  e => { e.preventDefault(); dz.classList.add('over'); });
dz.addEventListener('dragleave', ()  => dz.classList.remove('over'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('over');
  const f = e.dataTransfer.files[0];
  if (f) {
    const dt = new DataTransfer(); dt.items.add(f);
    document.getElementById('xfile').files = dt.files;
    onFile({ files: [f] });
  }
});

/* ── Generate ── */
async function doGenerate() {
  clearStatus();

  if (mode === 'manual') {
    for (let i = 0; i < items.length; i++) {
      if (!items[i].name.trim()) {
        showStatus('err', `Product ${i+1}: name is required.`); return;
      }
      if (items[i].price === '' || isNaN(parseFloat(items[i].price))) {
        showStatus('err', `Product ${i+1}: enter a valid price.`); return;
      }
    }
  } else {
    if (!document.getElementById('xfile').files[0]) {
      showStatus('err', 'Please select an Excel file.'); return;
    }
  }

  busy(true);
  showStatus('wait', 'Building your document…');

  try {
    const fd = new FormData();
    fd.append('poster_type', 'a4_single');
    fd.append('currency',    currency);
    fd.append('font_level',  sz);

    if (mode === 'excel') {
      fd.append('excel_file', document.getElementById('xfile').files[0]);
    } else {
      items.forEach((it, i) => {
        fd.append(`name_${i}`,  it.name.trim());
        fd.append(`price_${i}`, String(parseFloat(it.price)));
        fd.append(`unit_${i}`,  '');
      });
    }

    const res = await fetch('/generate', { method:'POST', body:fd });
    if (!res.ok) {
      let msg = 'Server error';
      try { msg = (await res.json()).error || msg; } catch(_){}
      throw new Error(msg);
    }

    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = 'poster_a5.docx';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showStatus('ok', '✓ Downloaded successfully!');
  } catch(e) {
    showStatus('err', '✕ ' + e.message);
  } finally {
    busy(false);
  }
}

function busy(b) {
  document.getElementById('gen-btn').disabled = b;
  document.getElementById('gen-spin').classList.toggle('hidden', !b);
  document.getElementById('gen-lbl').textContent = b ? 'Generating…' : '⬇ \u00a0Generate & Download';
}
function showStatus(type, msg) {
  const el = document.getElementById('status');
  el.className = 'status on ' + type;
  document.getElementById('s-icon').innerHTML =
    type === 'wait' ? '<div class="spin"></div>' : type === 'ok' ? '✓' : '✕';
  document.getElementById('s-text').textContent = msg;
}
function clearStatus() {
  document.getElementById('status').className = 'status';
}
</script>
