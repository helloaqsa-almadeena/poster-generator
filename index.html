<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AQSA Poster Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Anton = supermarket Impact-style bold font, Oswald = condensed bold for product name -->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #E8001C;
    --red-dark: #B8001A;
    --ink: #0D0D0D;
    --surface: #F5F4F1;
    --card: #FFFFFF;
    --muted: #888;
    --border: #E0DDD8;
    --success: #00A550;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Barlow', sans-serif; background: var(--surface); min-height: 100vh; color: var(--ink); overflow-x: hidden; }
  header { background: var(--ink); padding: 18px 20px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; }
  .logo-mark { width: 38px; height: 38px; background: var(--red); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 18px; color: white; flex-shrink: 0; }
  .header-text h1 { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 20px; color: white; line-height: 1; }
  .header-text p { font-size: 12px; color: #888; margin-top: 2px; }
  main { padding: 20px 16px 60px; max-width: 480px; margin: 0 auto; }
  .section-label { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; margin-top: 22px; }
  .card { background: var(--card); border-radius: 14px; border: 1px solid var(--border); overflow: hidden; }
  .field-group { padding: 16px; }
  .field-group + .field-group { border-top: 1px solid var(--border); }
  .field-label { font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 8px; display: block; }
  .field-sublabel { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 4px; }
  input[type="text"], input[type="number"] { width: 100%; border: 1.5px solid var(--border); border-radius: 10px; padding: 14px 16px; font-size: 16px; font-family: 'Barlow', sans-serif; font-weight: 500; color: var(--ink); background: var(--surface); outline: none; transition: border-color 0.18s, box-shadow 0.18s; -webkit-appearance: none; appearance: none; }
  input:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(232,0,28,0.1); background: white; }
  .price-row { display: flex; gap: 10px; align-items: center; }
  .currency-badge { background: var(--ink); color: white; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; padding: 14px 18px; border-radius: 10px; white-space: nowrap; flex-shrink: 0; }
  .price-row input { flex: 1; }
  .currency-toggle { display: flex; background: var(--surface); border-radius: 10px; padding: 4px; gap: 4px; }
  .currency-option { flex: 1; padding: 10px; border-radius: 8px; border: none; background: transparent; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; color: var(--muted); cursor: pointer; transition: all 0.18s; }
  .currency-option.active { background: var(--ink); color: white; }
  .poster-pills { display: flex; flex-direction: column; gap: 8px; }
  .poster-pill { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 2px solid var(--border); border-radius: 12px; cursor: pointer; background: white; transition: all 0.18s; text-align: left; width: 100%; }
  .poster-pill.selected { border-color: var(--red); background: #FFF5F6; }
  .pill-icon { width: 44px; height: 56px; border-radius: 6px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 13px; color: white; background: var(--ink); }
  .pill-text strong { display: block; font-size: 15px; font-weight: 700; color: var(--ink); margin-bottom: 2px; }
  .pill-text span { font-size: 12px; color: var(--muted); }
  .pill-check { margin-left: auto; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border); background: white; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.18s; }
  .poster-pill.selected .pill-check { background: var(--red); border-color: var(--red); }
  .pill-check-dot { width: 8px; height: 8px; border-radius: 50%; background: white; }

  /* Preview */
  .preview-strip { background: var(--ink); border-radius: 14px; padding: 16px 20px; margin-top: 22px; display: flex; align-items: center; gap: 16px; position: relative; overflow: hidden; }
  .preview-strip::before { content: ''; position: absolute; top: -30px; right: -30px; width: 120px; height: 120px; border-radius: 50%; background: rgba(232,0,28,0.15); }
  .preview-canvas-wrap { width: 72px; height: 100px; flex-shrink: 0; border-radius: 6px; overflow: hidden; background: white; }
  #previewCanvas { width: 72px; height: 100px; display: block; }
  .preview-divider { height: 40px; width: 1px; background: rgba(255,255,255,0.08); flex-shrink: 0; }
  .preview-info { flex: 1; min-width: 0; }
  .preview-label { font-size: 11px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; margin-bottom: 4px; }
  .preview-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 18px; color: white; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .preview-size-tag { display: inline-block; margin-top: 6px; background: rgba(232,0,28,0.25); color: var(--red); font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px; }

  .error-msg { background: #FFF0F0; border: 1px solid #FFCDD2; color: #C62828; border-radius: 10px; padding: 12px 14px; font-size: 13px; font-weight: 600; display: none; margin-top: 12px; }
  .error-msg.visible { display: block; animation: slideUp 0.2s ease; }
  .btn-create { width: 100%; background: var(--red); color: white; border: none; border-radius: 14px; padding: 18px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: 0.8px; text-transform: uppercase; cursor: pointer; margin-top: 22px; transition: all 0.18s; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .btn-create:active { transform: scale(0.98); background: var(--red-dark); }
  .btn-create:disabled { background: #ccc; cursor: not-allowed; transform: none; }
  .download-panel { display: none; margin-top: 22px; }
  .download-panel.visible { display: block; animation: slideUp 0.3s ease; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  .download-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .success-badge { width: 28px; height: 28px; background: var(--success); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; color: white; font-weight: 700; }
  .download-header span { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px; color: var(--ink); }
  .download-buttons { display: flex; flex-direction: column; gap: 10px; }
  .btn-download { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 12px; border: none; cursor: pointer; width: 100%; text-align: left; font-family: 'Barlow', sans-serif; transition: all 0.18s; }
  .btn-download:active { transform: scale(0.98); opacity: 0.9; }
  .btn-download.pdf { background: var(--ink); color: white; }
  .btn-download.word { background: #1F4E8C; color: white; }
  .dl-icon { width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; background: rgba(255,255,255,0.12); }
  .dl-text strong { display: block; font-size: 15px; font-weight: 700; }
  .dl-text span { font-size: 12px; opacity: 0.65; margin-top: 1px; display: block; }
  .dl-arrow { margin-left: auto; font-size: 18px; opacity: 0.6; }
  .print-tip { background: #FFF8E1; border: 1px solid #FFE082; border-radius: 10px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; margin-top: 10px; }
  .print-tip .tip-icon { font-size: 18px; flex-shrink: 0; }
  .print-tip p { font-size: 12px; color: #795548; font-weight: 500; line-height: 1.5; }
  .btn-reset { width: 100%; background: transparent; color: var(--muted); border: 1.5px solid var(--border); border-radius: 12px; padding: 14px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer; margin-top: 10px; }
  .spinner { width: 20px; height: 20px; border: 2.5px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="logo-mark">AQ</div>
  <div class="header-text">
    <h1>AQSA Poster Generator</h1>
    <p>Create &amp; print price posters instantly</p>
  </div>
</header>

<main>
  <div class="section-label">Product Details</div>
  <div class="card">
    <div class="field-group">
      <label class="field-label" for="productName">Product Name</label>
      <input type="text" id="productName" placeholder="e.g. FRESH MILK 1L" maxlength="80"
             oninput="updatePreview()" autocomplete="off" autocapitalize="characters">
    </div>
    <div class="field-group">
      <label class="field-label" for="price">Price <span class="field-sublabel" id="currencyLabel">AED</span></label>
      <div class="price-row">
        <div class="currency-badge" id="currencyBadge">AED</div>
        <input type="number" id="price" placeholder="0.00" min="0" step="0.01"
               inputmode="decimal" oninput="updatePreview()">
      </div>
    </div>
  </div>

  <div class="section-label">Currency</div>
  <div class="card">
    <div class="field-group">
      <div class="currency-toggle">
        <button class="currency-option active" onclick="setCurrency('AED', this)">AED</button>
        <button class="currency-option" onclick="setCurrency('د.إ', this)">د.إ Arabic</button>
      </div>
    </div>
  </div>

  <div class="section-label">Poster Type</div>
  <div class="card">
    <div class="field-group">
      <div class="poster-pills">
        <button class="poster-pill selected" onclick="selectPoster('a4', this)">
          <div class="pill-icon">A4</div>
          <div class="pill-text">
            <strong>A4 Portrait – Single Item</strong>
            <span>Large price tag · One product per page</span>
          </div>
          <div class="pill-check"><div class="pill-check-dot"></div></div>
        </button>
      </div>
    </div>
  </div>

  <!-- Live preview rendered on canvas (same draw function as PDF) -->
  <div class="preview-strip">
    <div class="preview-canvas-wrap">
      <canvas id="previewCanvas" width="216" height="300"></canvas>
    </div>
    <div class="preview-divider"></div>
    <div class="preview-info">
      <div class="preview-label">Preview</div>
      <div class="preview-name" id="prevNameLarge">—</div>
      <div class="preview-size-tag">A4 Portrait</div>
    </div>
  </div>

  <div class="error-msg" id="errorMsg"></div>

  <button class="btn-create" id="createBtn" onclick="createPoster()">
    🖨&nbsp; CREATE POSTER
  </button>

  <div class="download-panel" id="downloadPanel">
    <div class="download-header">
      <div class="success-badge">✓</div>
      <span>Poster ready — choose format</span>
    </div>
    <div class="download-buttons">
      <button class="btn-download pdf" onclick="downloadPDF()">
        <div class="dl-icon">📄</div>
        <div class="dl-text">
          <strong>Download PDF</strong>
          <span>Best for printing · Canon app ready</span>
        </div>
        <div class="dl-arrow">↓</div>
      </button>
      <button class="btn-download word" onclick="downloadDOCX()">
        <div class="dl-icon">📝</div>
        <div class="dl-text">
          <strong>Download Word (.docx)</strong>
          <span>Editable · Microsoft Word format</span>
        </div>
        <div class="dl-arrow">↓</div>
      </button>
    </div>
    <div class="print-tip">
      <span class="tip-icon">💡</span>
      <p>Open the downloaded file in the <strong>Canon PRINT Inkjet/SELPHY</strong> app to print directly from your phone.</p>
    </div>
    <button class="btn-reset" onclick="resetForm()">+ Make Another Poster</button>
  </div>
</main>

<!-- jsPDF — PDF from Canvas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<!-- JSZip for DOCX -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>
var state = { currency: 'AED', pdfBlob: null, docxBlob: null, fontsReady: false };

// ── Wait for Anton + Oswald to load before first draw ──
document.fonts.ready.then(function() {
  state.fontsReady = true;
  updatePreview();
});

function setCurrency(val, btn) {
  state.currency = val;
  document.getElementById('currencyBadge').textContent = val;
  document.getElementById('currencyLabel').textContent = val;
  document.querySelectorAll('.currency-option').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  updatePreview();
}

function selectPoster(type, btn) {
  document.querySelectorAll('.poster-pill').forEach(function(p){ p.classList.remove('selected'); });
  btn.classList.add('selected');
}

function showError(msg) {
  var el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('visible');
  setTimeout(function(){ el.classList.remove('visible'); }, 3500);
}

function validate() {
  var name  = document.getElementById('productName').value.trim();
  var price = parseFloat(document.getElementById('price').value);
  if (!name)                     { showError('⚠️ Please enter a product name.');  return false; }
  if (isNaN(price) || price < 0) { showError('⚠️ Please enter a valid price.'); return false; }
  return true;
}

// ══════════════════════════════════════════════════════
//  CORE DRAW FUNCTION — draws poster onto any canvas ctx
//  W, H = canvas pixel dimensions
//  scale = 1 for preview, higher for PDF export canvas
// ══════════════════════════════════════════════════════
function drawPoster(ctx, W, H, name, integer, decStr, currency) {
  var RED    = '#E8001C';
  var SHADOW = 'rgba(0,0,0,0.18)';
  var BLACK  = '#000000';
  var WHITE  = '#FFFFFF';

  // ── Background ──
  ctx.fillStyle = WHITE;
  ctx.fillRect(0, 0, W, H);

  // ── Font families (Anton = Impact-style, Oswald = condensed bold for name) ──
  var INT_FONT  = 'Anton, Impact, Arial Black, sans-serif';
  var NAME_FONT = 'Oswald, "Arial Narrow", Arial, sans-serif';
  var CUR_FONT  = 'Anton, Impact, Arial Black, sans-serif';

  // ── Font sizes (proportional to height) ──
  var intSize = Math.round(H * 0.40);   // integer takes ~40% of page height
  var decSize = Math.round(H * 0.115);  // decimal ~11.5%
  var curSize = Math.round(H * 0.065);  // currency ~6.5%

  // ── Vertical: integer baseline at 58% down from top ──
  var intBaseY = H * 0.58;

  // ── Measure integer width ──
  ctx.font = '900 ' + intSize + 'px ' + INT_FONT;
  var intW   = ctx.measureText(integer).width;
  var intX   = (W - intW) / 2;   // centered

  // ── Drop shadow for integer ──
  var sh = W * 0.012;
  ctx.save();
  ctx.shadowColor   = 'rgba(0,0,0,0.30)';
  ctx.shadowOffsetX = sh;
  ctx.shadowOffsetY = sh;
  ctx.shadowBlur    = sh * 2;
  ctx.fillStyle = RED;
  ctx.font = '900 ' + intSize + 'px ' + INT_FONT;
  ctx.fillText(integer, intX, intBaseY);
  ctx.restore();

  // ── Decimal: raised — baseline at top of integer (intBaseY - intSize * 0.72) ──
  var decBaseY = intBaseY - intSize * 0.60;
  var dotDecStr = '.' + decStr;
  ctx.font = '900 ' + decSize + 'px ' + INT_FONT;
  var decX = intX + intW + W * 0.008;

  ctx.save();
  ctx.shadowColor   = 'rgba(0,0,0,0.25)';
  ctx.shadowOffsetX = sh * 0.6;
  ctx.shadowOffsetY = sh * 0.6;
  ctx.shadowBlur    = sh;
  ctx.fillStyle = RED;
  ctx.fillText(dotDecStr, decX, decBaseY);
  ctx.restore();

  // ── Currency: bottom-left of integer, small ──
  ctx.font = '900 ' + curSize + 'px ' + CUR_FONT;
  var curW = ctx.measureText(currency).width;
  var curX = intX - curW - W * 0.015;
  var curY = intBaseY;  // same baseline as integer
  ctx.fillStyle = RED;
  ctx.fillText(currency, curX, curY);

  // ── Product name — Oswald Bold, black, centered, bottom 20% ──
  var maxNameSize = Math.round(H * 0.085);
  var maxW = W * 0.92;

  // Word-wrap
  var words = name.split(' ');
  var lines = [];
  var cur = '';
  ctx.font = '700 ' + maxNameSize + 'px ' + NAME_FONT;
  for (var i = 0; i < words.length; i++) {
    var test = cur ? cur + ' ' + words[i] : words[i];
    if (ctx.measureText(test).width <= maxW) { cur = test; }
    else { if (cur) lines.push(cur); cur = words[i]; }
  }
  if (cur) lines.push(cur);

  // Shrink font until all lines fit
  var nameSize = maxNameSize;
  var fits = false;
  while (!fits && nameSize > 14) {
    ctx.font = '700 ' + nameSize + 'px ' + NAME_FONT;
    fits = lines.every(function(l){ return ctx.measureText(l).width <= maxW; });
    if (!fits) nameSize -= 2;
  }

  var lineH = nameSize * 1.18;
  var totalNameH = lines.length * lineH;
  // Bottom anchor: last line baseline ~6% from bottom
  var lastLineY = H * 0.94;
  var firstLineY = lastLineY - (lines.length - 1) * lineH;

  ctx.fillStyle = BLACK;
  ctx.font = '700 ' + nameSize + 'px ' + NAME_FONT;
  for (var k = 0; k < lines.length; k++) {
    var lw = ctx.measureText(lines[k]).width;
    ctx.fillText(lines[k], (W - lw) / 2, firstLineY + k * lineH);
  }
}

// ── Update live preview canvas ──
function updatePreview() {
  var name     = (document.getElementById('productName').value || 'PRODUCT NAME').toUpperCase();
  var raw      = parseFloat(document.getElementById('price').value) || 0;
  var integer  = String(Math.floor(raw));
  var decStr   = raw.toFixed(2).split('.')[1];
  var currency = state.currency;

  document.getElementById('prevNameLarge').textContent = name;

  var canvas = document.getElementById('previewCanvas');
  var ctx    = canvas.getContext('2d');
  drawPoster(ctx, canvas.width, canvas.height, name, integer, decStr, currency);
}

// ── Generate PDF by drawing to a high-res canvas then exporting ──
function makePDF(name, price, currency) {
  var integer = String(Math.floor(price));
  var decStr  = price.toFixed(2).split('.')[1];

  // A4 at 150dpi: 1240 x 1754 px
  var PW = 1240, PH = 1754;
  var offscreen = document.createElement('canvas');
  offscreen.width  = PW;
  offscreen.height = PH;
  var ctx = offscreen.getContext('2d');
  drawPoster(ctx, PW, PH, name, integer, decStr, currency);

  // Export canvas to PDF using jsPDF
  var jsPDF = window.jspdf.jsPDF;
  var doc   = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  var imgData = offscreen.toDataURL('image/jpeg', 0.97);
  doc.addImage(imgData, 'JPEG', 0, 0, 210, 297);
  return doc.output('blob');
}

// ── DOCX: raw XML via JSZip ──
function makeDOCX(name, price, currency) {
  var integer = Math.floor(price);
  var decimal = price.toFixed(2).split('.')[1];

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Note: in DOCX the currency symbol renders correctly even if Arabic
  // sz = half-points. 480 = 240pt (giant), 160 = 80pt, 80 = 40pt
  var docXml =
'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
'<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
'<w:body>' +

// Top spacer
'<w:p><w:pPr><w:spacing w:before="0" w:after="3400"/></w:pPr></w:p>' +

// Price row: [currency small] [integer giant] [.decimal raised]
'<w:p>' +
  '<w:pPr><w:jc w:val="center"/><w:spacing w:before="0" w:after="0"/></w:pPr>' +
  // Currency
  '<w:r><w:rPr><w:b/><w:color w:val="E8001C"/><w:sz w:val="80"/><w:szCs w:val="80"/>' +
  '<w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/></w:rPr>' +
  '<w:t xml:space="preserve">' + esc(currency) + ' </w:t></w:r>' +
  // Integer
  '<w:r><w:rPr><w:b/><w:color w:val="E8001C"/><w:sz w:val="480"/><w:szCs w:val="480"/>' +
  '<w:rFonts w:ascii="Arial" w:hAnsi="Arial"/></w:rPr>' +
  '<w:t>' + esc(String(integer)) + '</w:t></w:r>' +
  // .decimal raised
  '<w:r><w:rPr><w:b/><w:color w:val="E8001C"/><w:sz w:val="160"/><w:szCs w:val="160"/>' +
  '<w:rFonts w:ascii="Arial" w:hAnsi="Arial"/><w:vertAlign w:val="superscript"/></w:rPr>' +
  '<w:t>.' + esc(decimal) + '</w:t></w:r>' +
'</w:p>' +

// Spacer
'<w:p><w:pPr><w:spacing w:before="700" w:after="0"/></w:pPr></w:p>' +

// Product name
'<w:p>' +
  '<w:pPr><w:jc w:val="center"/><w:spacing w:before="0" w:after="0"/></w:pPr>' +
  '<w:r><w:rPr><w:b/><w:color w:val="000000"/><w:sz w:val="110"/><w:szCs w:val="110"/>' +
  '<w:rFonts w:ascii="Arial" w:hAnsi="Arial"/></w:rPr>' +
  '<w:t>' + esc(name) + '</w:t></w:r>' +
'</w:p>' +

// A4 page
'<w:sectPr>' +
  '<w:pgSz w:w="11906" w:h="16838"/>' +
  '<w:pgMar w:top="720" w:right="600" w:bottom="720" w:left="600"/>' +
'</w:sectPr>' +
'</w:body></w:document>';

  var relsXml =
'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
'<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
'</Relationships>';

  var stylesXml =
'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
'<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
'<w:docDefaults><w:rPrDefault><w:rPr>' +
'<w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/><w:sz w:val="24"/>' +
'</w:rPr></w:rPrDefault></w:docDefaults>' +
'</w:styles>';

  var contentTypes =
'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
'<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
'<Default Extension="xml" ContentType="application/xml"/>' +
'<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
'<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>' +
'</Types>';

  var packageRels =
'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
'<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
'</Relationships>';

  var zip = new JSZip();
  zip.file('[Content_Types].xml', contentTypes);
  zip.file('_rels/.rels', packageRels);
  zip.file('word/document.xml', docXml);
  zip.file('word/_rels/document.xml.rels', relsXml);
  zip.file('word/styles.xml', stylesXml);
  return zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}

// ── Create ──
function createPoster() {
  if (!validate()) return;
  var btn = document.getElementById('createBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>&nbsp; GENERATING...';

  setTimeout(function() {
    try {
      var name     = document.getElementById('productName').value.trim().toUpperCase();
      var price    = parseFloat(document.getElementById('price').value) || 0;
      var currency = state.currency;

      state.pdfBlob  = makePDF(name, price, currency);
      state.docxBlob = makeDOCX(name, price, currency);

      btn.innerHTML = '✓&nbsp; POSTER CREATED!';
      btn.style.background = 'var(--success)';
      var panel = document.getElementById('downloadPanel');
      panel.classList.add('visible');
      panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

      setTimeout(function() {
        btn.innerHTML = '🖨&nbsp; CREATE POSTER';
        btn.style.background = '';
        btn.disabled = false;
      }, 2500);
    } catch(e) {
      showError('❌ Error: ' + e.message);
      btn.innerHTML = '🖨&nbsp; CREATE POSTER';
      btn.style.background = '';
      btn.disabled = false;
    }
  }, 300);
}

function triggerDownload(blob, filename) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
}

function downloadPDF() {
  if (!state.pdfBlob) { showError('Please create a poster first.'); return; }
  var n = document.getElementById('productName').value.trim().replace(/\s+/g,'_') || 'poster';
  triggerDownload(state.pdfBlob, 'poster_' + n + '.pdf');
}

function downloadDOCX() {
  if (!state.docxBlob) { showError('Please create a poster first.'); return; }
  var n = document.getElementById('productName').value.trim().replace(/\s+/g,'_') || 'poster';
  Promise.resolve(state.docxBlob).then(function(blob) {
    triggerDownload(blob, 'poster_' + n + '.docx');
  });
}

function resetForm() {
  document.getElementById('productName').value = '';
  document.getElementById('price').value = '';
  document.getElementById('downloadPanel').classList.remove('visible');
  state.pdfBlob = null; state.docxBlob = null;
  updatePreview();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
